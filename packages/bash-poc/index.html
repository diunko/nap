<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bash-poc</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #1e1e1e; }
    #terminal {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .wterm {
      /* palette matched to packages/v3 dark theme */
      --term-fg: #e5e5e5;
      --term-bg: #1e1e1e;
      --term-cursor: #aeafad;
      --term-color-0: #252526;
      --term-color-1: #f44747;
      --term-color-2: #22c55e;
      --term-color-3: #d7ba7d;
      --term-color-4: #569cd6;
      --term-color-5: #c586c0;
      --term-color-6: #4ec9b0;
      --term-color-7: #cccccc;
      --term-color-8: #6b7280;
      --term-color-9: #f44747;
      --term-color-10: #22c55e;
      --term-color-11: #dcdcaa;
      --term-color-12: #9cdcfe;
      --term-color-13: #c586c0;
      --term-color-14: #4ec9b0;
      --term-color-15: #e5e5e5;
      --term-font-family: 'Menlo', 'Monaco', 'Consolas', 'DejaVu Sans Mono', monospace;
      --term-font-size: 14px;
      --term-line-height: 1.2;
      --term-row-height: 17px;

      position: relative;
      background: var(--term-bg);
      color: var(--term-fg);
      font-family: var(--term-font-family);
      font-size: var(--term-font-size);
      line-height: var(--term-line-height);
      padding: 12px;
      outline: none;
      overflow: hidden;
    }
    .wterm:focus, .wterm:focus-visible { outline: none; }
    .term-grid { display: block; white-space: pre; contain: layout paint style; }
    .term-row { display: block; height: var(--term-row-height); line-height: var(--term-row-height); contain: layout style; }
    .term-row > span { display: inline-block; height: var(--term-row-height); vertical-align: top; }
    .term-block { width: 1ch; overflow: hidden; }
    .term-cursor { outline: 1px solid var(--term-cursor); outline-offset: -1px; }
    .wterm.focused .term-cursor { background: var(--term-cursor); color: var(--term-bg); outline: none; }
    .wterm.focused.cursor-blink .term-cursor { animation: cursor-blink 1s step-end infinite; }
    @keyframes cursor-blink {
      0%, 100% { background: var(--term-cursor); color: var(--term-bg); }
      50% { background: transparent; color: inherit; }
    }
    .wterm.has-scrollback { overflow-y: auto; }
    .wterm ::selection { background: rgba(86, 156, 214, 0.3); }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
