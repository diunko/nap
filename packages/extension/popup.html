<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 13px;
      background: #f0f4f8;
      color: #2e3440;
    }
    h2 { font-size: 14px; margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #c4cad0;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    button {
      padding: 6px 12px;
      border: 1px solid #c4cad0;
      border-radius: 4px;
      background: #e6eaee;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #dce0e4; }
    #status { font-size: 12px; color: #6d7a8a; }
    #status.ok { color: #16a34a; }
    #status.err { color: #dc2626; }

    .field { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2>nap settings</h2>
  <div class="field">
    <label>GitHub PAT</label>
    <input id="pat" type="password" placeholder="ghp_..." />
  </div>
  <div class="field">
    <label>Main code repo (owner/repo)</label>
    <input id="repo" type="text" placeholder="org/project" />
  </div>
  <div class="field">
    <label>Branch</label>
    <input id="branch" type="text" placeholder="main" />
  </div>
  <div class="row">
    <button id="save">Save</button>
    <button id="test">Test PAT</button>
    <span id="status"></span>
  </div>
  <script src="src/popup.ts" type="module"></script>
</body>
</html>
